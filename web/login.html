<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Sign in · Compass</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login">
    <form class="panel login-card" id="login-form" novalidate>
      <p class="brand"><span class="brand-mark" aria-hidden="true"></span>Compass</p>
      <h1>Enter your passcode</h1>
      <div class="field">
        <label for="passcode">Passcode</label>
        <input id="passcode" name="passcode" type="password" autocomplete="current-password" maxlength="200" required autofocus>
      </div>
      <p class="login-status" id="login-status" role="alert"></p>
      <button type="submit" class="btn btn-main">Sign in</button>
    </form>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
